services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opensunsama}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-opensunsama}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    restart: unless-stopped

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5


  api:
    build:
      context: .
      dockerfile: Dockerfile.api

    command: ["sh", "docker-start.sh"]
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: "3001"

      DATABASE_URL: postgresql://${POSTGRES_USER:-opensunsama}:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/${POSTGRES_DB:-opensunsama}
      REDIS_URL: redis://redis:6379

      MIGRATE_ON_START: "true"

      API_URL: ${PUBLIC_API_URL:?}
      WEB_APP_URL: ${PUBLIC_WEB_URL:?}
      FRONTEND_URL: ${PUBLIC_WEB_URL:?}
      CORS_ORIGIN: ${PUBLIC_WEB_URL:?}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}

      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_WORKERS_ENABLED: ${EMAIL_WORKERS_ENABLED:-false}

      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}

    volumes:
      - api_secrets:/app/secrets

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: ${PUBLIC_API_URL:?}

    restart: unless-stopped

    depends_on:
      - api


volumes:
  postgres_data:
  redis_data:
  api_secrets:
